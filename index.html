<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Profile Finder</title>
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="search-container">
        <input
          type="text"
          name=""
          id="input"
          placeholder="Enter Github UserName"
          class=""
        />
        <button id="search">Search User</button>
      </div>

      <div class="profile-card">
        <div class="main-info">
          <img src="./assets/github-logo.png" alt="avatar" id="prof-img" />
          <span class="name" id="name">Your Github Profile Name</span>
          <a href="" id="username"></a>
        </div>
        <div class="bio">
          <p id="bio">Headline</p>
          <p><span id="repo">0</span> Repositories</p>
        </div>
        <div class="follow">
          <div class="followers">
            <span class="no" id="followers">0</span>
            Followers
          </div>
          <div class="following">
            <span class="no" id="following">0</span>
            Following
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
    
    <footer class="footer">
      <div class="footer-content">
        <p>Connect with us:</p>
        <div class="home__social">
          <a href="https://www.instagram.com" target="_blank" class="home__social-icon">
            <i class="uil uil-instagram"></i>
          </a>
          <a href="https://github.com" target="_blank" class="home__social-icon">
            <i class="uil uil-github-alt"></i>
          </a>
          <a href="https://www.linkedin.com" target="_blank" class="home__social-icon">
            <i class="uil uil-linkedin-alt"></i>
          </a>
          <a href="https://twitter.com" target="_blank" class="home__social-icon">
            <i class="uil uil-twitter-alt"></i>
          </a>
        </div>
      </div>
      <div class="footer-bottom">
        <p>Created by Sandun Harshana</p>
        <p>&copy; 2025 Github Profile Finder. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
